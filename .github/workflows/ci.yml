name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-token-scan:
    name: internal-token-scan behaves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The script's own checks: planted tokens are reported, ordinary text passes, an unread tree
      # is refused, list inputs switch off when empty.
      - name: Run the fixture checks
        run: bash internal-token-scan/test.sh

      # The action as a consumer uses it, against the clean fixture, so a broken action.yml (a
      # renamed input, a missing env mapping) fails here rather than in the first consumer's CI.
      - name: Use the action on the clean fixture
        uses: ./internal-token-scan
        with:
          path: internal-token-scan/fixtures/clean
          min-files: '1'

  nuget-unpublished:
    name: nuget-unpublished behaves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Against a stand-in index: all published, one of two missing, never published, an index that
      # cannot be asked, nothing packed, a package at another version.
      - name: Run the stand-in checks
        run: bash nuget-unpublished/test.sh

      # The action as a consumer uses it, against nuget.org itself, for a package version that is
      # certainly published -- a broken action.yml or a changed index answer fails here first.
      - name: Stand in a packed package that nuget.org has
        run: mkdir -p "$RUNNER_TEMP/p" && touch "$RUNNER_TEMP/p/Newtonsoft.Json.13.0.1.nupkg"

      - name: Use the action against nuget.org
        id: published
        uses: ./nuget-unpublished
        with:
          version: 13.0.1
          packages: ${{ runner.temp }}/p

      - name: It reads as published
        run: test "${{ steps.published.outputs.any }}" = false

  package-consumer-check:
    name: package-consumer-check behaves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Packs and builds the fixtures for real: the passing library, a solution whose library packs on
      # build (checked from a clean copy, as CI sees it), and the library carrying every
      # defect the check reports (missing XML docs / readme / license, a snippet that does not
      # compile, a package nobody was told to install, a marker without a fence).
      - name: Run the fixture checks
        run: bash package-consumer-check/test.sh

      # The action as a consumer uses it, so a broken action.yml fails here first.
      - name: Use the action on the passing fixture
        uses: ./package-consumer-check
        with:
          project: package-consumer-check/fixtures/good/Widgets.csproj
          readme: package-consumer-check/fixtures/good/README.md
          min-snippets: '1'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck the scripts
        run: shellcheck --severity=warning internal-token-scan/scan.sh internal-token-scan/test.sh package-consumer-check/check.sh package-consumer-check/test.sh
